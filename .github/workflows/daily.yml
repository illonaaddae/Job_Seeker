name: Daily run

# The autonomous loop: discovers new roles, scores them, drafts the best
# matches, approves the ones that clear AUTO_APPROVE_SCORE, sends them, chases
# them, reads the inbox and emails a summary. Every weekday morning in Accra.
#
# Sending is real here, and four independent gates have to agree before a single
# email leaves:
#
#   1. SEND_ENABLED=true          the master switch, enforced in the mailer
#   2. AUTO_APPROVE_SCORE > 0     unset means every draft still waits for a human
#   3. score >= that threshold    and the threshold is above MIN_SCORE_TO_SEND
#   4. "live": true in the body   without it every send is simulated
#
# A draft the style guard was unhappy with is never approved automatically, and
# DAILY_SEND_CAP still caps the day. Set AUTO_APPROVE_SCORE back to 0 to put the
# human approval step back without touching this file.
#
# Requires a deployed instance:
#   Repository variable  JOBSEEKER_URL         https://your-app.azurewebsites.net
#   Repository secret    JOBSEEKER_API_TOKEN   the API token from the deploy
#
# Without them this skips rather than failing every morning.

on:
  schedule:
    - cron: "0 6 * * 1-5" # 06:00 UTC, which is 06:00 in Ghana
  workflow_dispatch:
    inputs:
      stages:
        description: Stages to run, comma separated
        default: discover,score,draft,replies,auto_approve,send,followup,respond,digest
        required: false
      live:
        description: Send for real. Leave false to simulate every send.
        default: "true"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: vars.JOBSEEKER_URL != ''
    steps:
      - name: Run each stage against the deployed API
        env:
          BASE: ${{ vars.JOBSEEKER_URL }}
          TOKEN: ${{ secrets.JOBSEEKER_API_TOKEN }}
          STAGES: ${{ github.event.inputs.stages || 'discover,score,draft,replies,auto_approve,send,followup,respond,digest' }}
          LIVE: ${{ github.event.inputs.live || 'true' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LIST <<< "$STAGES"
          for stage in "${LIST[@]}"; do
            echo "::group::$stage"
            curl --fail --show-error --silent --max-time 900 \
              -X POST "$BASE/api/run/$stage" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"live\": $LIVE}"
            echo
            echo "::endgroup::"
          done

      - name: Summarise the funnel
        env:
          BASE: ${{ vars.JOBSEEKER_URL }}
          TOKEN: ${{ secrets.JOBSEEKER_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent "$BASE/api/stats" \
            -H "Authorization: Bearer $TOKEN" > stats.json
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("stats.json", encoding="utf-8") as handle:
              stats = json.load(handle)

          by_job = stats.get("jobs_by_status", {})
          by_application = stats.get("applications_by_status", {})

          print("## JobSeeker funnel")
          print()
          print(f"- Roles tracked: {stats.get('jobs_total', 0)}")
          print(f"- Shortlisted: {by_job.get('shortlisted', 0)}")
          print(f"- Drafts waiting for approval: {by_application.get('draft', 0)}")
          print(f"- Sent: {stats.get('sent', 0)}")
          print(f"- Replies: {stats.get('replied', 0)}")
          print(f"- Interviews and offers: {stats.get('positive', 0)}")
          PY
