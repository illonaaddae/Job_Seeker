<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>JobSeeker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235E6AD2'/><path d='M9 20l4-9 3 6 2-3 5 6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem("jobseeker.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: a review queue, not a metrics dashboard. It refuses the four
      identical stat cards above a chart; the pipeline is one sequential funnel
      because that is what the engine actually is.
      OWN-WORLD: near-black #010102 canvas, four charcoal surface steps, three
      hairline weights, no shadow except on things that float. One lavender
      #5e6ad2 for brand, primary action, focus, current row. Status rides in a
      6px glyph beside neutral text. Inter alone, 8px controls, 12px cards.
      STORY: what is waiting for me, which roles are worth my afternoon, is the
      letter good enough to send.
      FIRST VIEWPORT: 248px nav rail, 56px bar with title and one primary
      action, funnel strip, then the queue at 44px rows.
      FORM: Linear design language, pinned by the user from awesome-design-md;
      no direction roll was dealt.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
